name: OrderCraft CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend build & test ─────────────────────────────────────────
  backend:
    name: Backend (Java / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: ordercraft_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven (skip tests for speed)
        run: ./mvnw clean package -DskipTests
        env:
          DB_URL: jdbc:mysql://localhost:3306/ordercraft_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci-test-secret-key-32bytes-long!!!

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordercraft-backend-jar
          path: backend/target/*.jar

  # ── Frontend build ───────────────────────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordercraft-frontend-dist
          path: frontend/dist/
