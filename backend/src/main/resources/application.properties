spring.application.name=ordercraft-backend
server.port=8080

# ─── MySQL Database ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ordercraft?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Ajay@9090
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ─── JSON ─────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ─── JWT ──────────────────────────────────────────────────────────────────────
ordercraft.jwt.secret=${JWT_SECRET:ordercraft-dev-secret-key-32bytes-long!!!}
ordercraft.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── CORS ─────────────────────────────────────────────────────────────────────
ordercraft.cors.allowed-origins=http://localhost:4200,http://localhost:4201

# ─── Seeded admin account ─────────────────────────────────────────────────────
ordercraft.admin.username=admin
ordercraft.admin.password=Admin@123
ordercraft.admin.email=admin@ordercraft.com
ordercraft.admin.reset-password=false

# ─── Error handling ───────────────────────────────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
